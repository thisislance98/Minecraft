<svg viewBox="0 0 1200 1400" xmlns="http://www.w3.org/2000/svg">
  <!-- Title -->
  <text x="600" y="40" text-anchor="middle" font-size="32" font-weight="bold" fill="#333">
    Few-Shot AI System Architecture
  </text>

  <!-- Client Layer -->
  <g id="client-layer">
    <rect x="50" y="80" width="1100" height="280" fill="#E3F2FD" stroke="#1976D2" stroke-width="3" rx="10"/>
    <text x="70" y="110" font-size="20" font-weight="bold" fill="#1976D2">CLIENT (Browser)</text>

    <!-- Player -->
    <rect x="80" y="140" width="160" height="80" fill="#BBDEFB" stroke="#1565C0" stroke-width="2" rx="5"/>
    <text x="160" y="170" text-anchor="middle" font-size="16" font-weight="bold">Player</text>
    <text x="160" y="195" text-anchor="middle" font-size="12">"Create a dragon"</text>

    <!-- TaskManager -->
    <rect x="280" y="140" width="160" height="80" fill="#64B5F6" stroke="#1565C0" stroke-width="2" rx="5"/>
    <text x="360" y="165" text-anchor="middle" font-size="16" font-weight="bold">TaskManager</text>
    <text x="360" y="185" text-anchor="middle" font-size="11">Queue & Context</text>
    <text x="360" y="205" text-anchor="middle" font-size="11">Position/Direction</text>

    <!-- Agent -->
    <rect x="480" y="140" width="160" height="80" fill="#64B5F6" stroke="#1565C0" stroke-width="2" rx="5"/>
    <text x="560" y="165" text-anchor="middle" font-size="16" font-weight="bold">Agent</text>
    <text x="560" y="185" text-anchor="middle" font-size="11">Tool Executor</text>
    <text x="560" y="205" text-anchor="middle" font-size="11">spawn/set_blocks</text>

    <!-- UIManager -->
    <rect x="680" y="140" width="160" height="80" fill="#64B5F6" stroke="#1565C0" stroke-width="2" rx="5"/>
    <text x="760" y="165" text-anchor="middle" font-size="16" font-weight="bold">UIManager</text>
    <text x="760" y="185" text-anchor="middle" font-size="11">Chat Display</text>
    <text x="760" y="205" text-anchor="middle" font-size="11">Notifications</text>

    <!-- VoxelGame -->
    <rect x="880" y="140" width="160" height="80" fill="#64B5F6" stroke="#1565C0" stroke-width="2" rx="5"/>
    <text x="960" y="165" text-anchor="middle" font-size="16" font-weight="bold">VoxelGame</text>
    <text x="960" y="185" text-anchor="middle" font-size="11">World State</text>
    <text x="960" y="205" text-anchor="middle" font-size="11">Rendering</text>

    <!-- Client arrows -->
    <path d="M 240,180 L 280,180" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    <path d="M 360,220 L 560,140" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    <path d="M 360,220 L 760,220" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    <path d="M 640,180 L 680,180" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    <path d="M 840,180 L 880,180" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  </g>

  <!-- WebSocket Connection -->
  <g id="websocket">
    <line x1="360" y1="360" x2="360" y2="440" stroke="#FF9800" stroke-width="4" stroke-dasharray="10,5"/>
    <rect x="300" y="390" width="120" height="30" fill="#FFF3E0" stroke="#FF9800" stroke-width="2" rx="5"/>
    <text x="360" y="410" text-anchor="middle" font-size="14" font-weight="bold" fill="#E65100">WebSocket</text>
  </g>

  <!-- Server Layer -->
  <g id="server-layer">
    <rect x="50" y="440" width="1100" height="380" fill="#E8F5E9" stroke="#388E3C" stroke-width="3" rx="10"/>
    <text x="70" y="470" font-size="20" font-weight="bold" fill="#388E3C">SERVER (Node.js)</text>

    <!-- WebSocket Server -->
    <rect x="280" y="500" width="160" height="60" fill="#A5D6A7" stroke="#2E7D32" stroke-width="2" rx="5"/>
    <text x="360" y="525" text-anchor="middle" font-size="16" font-weight="bold">WS Server</text>
    <text x="360" y="545" text-anchor="middle" font-size="11">Route Messages</text>

    <!-- FewShotSession -->
    <rect x="280" y="590" width="160" height="80" fill="#66BB6A" stroke="#2E7D32" stroke-width="2" rx="5"/>
    <text x="360" y="615" text-anchor="middle" font-size="16" font-weight="bold">FewShotSession</text>
    <text x="360" y="635" text-anchor="middle" font-size="11">Message Handler</text>
    <text x="360" y="655" text-anchor="middle" font-size="11">Model Config</text>

    <!-- FewShotAI Core -->
    <rect x="480" y="500" width="180" height="170" fill="#4CAF50" stroke="#1B5E20" stroke-width="3" rx="5"/>
    <text x="570" y="525" text-anchor="middle" font-size="18" font-weight="bold" fill="white">FewShotAI Core</text>
    <text x="570" y="550" text-anchor="middle" font-size="12" fill="white">1. Route Request</text>
    <text x="570" y="575" text-anchor="middle" font-size="12" fill="white">2. Select Examples</text>
    <text x="570" y="600" text-anchor="middle" font-size="12" fill="white">3. Generate Code</text>
    <text x="570" y="625" text-anchor="middle" font-size="12" fill="white">4. Validate</text>
    <text x="570" y="650" text-anchor="middle" font-size="12" fill="white">5. Execute/Return</text>

    <!-- Example Library -->
    <rect x="700" y="500" width="180" height="170" fill="#2196F3" stroke="#0D47A1" stroke-width="2" rx="5"/>
    <text x="790" y="525" text-anchor="middle" font-size="16" font-weight="bold" fill="white">Example Library</text>
    <text x="790" y="555" text-anchor="middle" font-size="13" fill="white">🦁 Creatures</text>
    <text x="790" y="580" text-anchor="middle" font-size="11" fill="white">Bunny, Dragon, Robot...</text>
    <text x="790" y="610" text-anchor="middle" font-size="13" fill="white">⚔️ Items</text>
    <text x="790" y="635" text-anchor="middle" font-size="11" fill="white">Wands, Swords, Potions...</text>
    <text x="790" y="660" text-anchor="middle" font-size="13" fill="white">🏗️ Structures</text>

    <!-- AI Routes -->
    <rect x="920" y="590" width="160" height="80" fill="#A5D6A7" stroke="#2E7D32" stroke-width="2" rx="5"/>
    <text x="1000" y="615" text-anchor="middle" font-size="16" font-weight="bold">AI Routes</text>
    <text x="1000" y="635" text-anchor="middle" font-size="11">HTTP Endpoints</text>
    <text x="1000" y="655" text-anchor="middle" font-size="11">Test API</text>

    <!-- Server arrows -->
    <path d="M 360,560 L 360,590" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    <path d="M 440,630 L 480,590" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    <path d="M 660,585 L 700,585" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    <path d="M 920,630 L 880,585" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  </g>

  <!-- OpenRouter API -->
  <g id="openrouter">
    <line x1="570" y1="820" x2="570" y2="900" stroke="#FF9800" stroke-width="4" stroke-dasharray="10,5"/>
    <rect x="490" y="850" width="160" height="30" fill="#FFF3E0" stroke="#FF9800" stroke-width="2" rx="5"/>
    <text x="570" y="870" text-anchor="middle" font-size="14" font-weight="bold" fill="#E65100">API Calls</text>

    <rect x="450" y="900" width="240" height="140" fill="#FFE0B2" stroke="#E65100" stroke-width="3" rx="10"/>
    <text x="570" y="930" text-anchor="middle" font-size="20" font-weight="bold" fill="#E65100">OpenRouter API</text>
    <text x="570" y="965" text-anchor="middle" font-size="14">🤖 Claude Opus 4.6</text>
    <text x="570" y="990" text-anchor="middle" font-size="14">🤖 GPT-5.2 Codex</text>
    <text x="570" y="1015" text-anchor="middle" font-size="14">🤖 Gemini 3 Pro</text>
  </g>

  <!-- Data Flow -->
  <g id="data-flow">
    <text x="50" y="1090" font-size="24" font-weight="bold" fill="#333">Request Flow</text>

    <!-- Step boxes -->
    <rect x="50" y="1110" width="200" height="60" fill="#E3F2FD" stroke="#1976D2" stroke-width="2" rx="5"/>
    <text x="150" y="1135" text-anchor="middle" font-size="14" font-weight="bold">1. User Input</text>
    <text x="150" y="1155" text-anchor="middle" font-size="11">"Create fire dragon"</text>

    <rect x="280" y="1110" width="200" height="60" fill="#E8F5E9" stroke="#388E3C" stroke-width="2" rx="5"/>
    <text x="380" y="1135" text-anchor="middle" font-size="14" font-weight="bold">2. Route</text>
    <text x="380" y="1155" text-anchor="middle" font-size="11">Tool: create_creature</text>

    <rect x="510" y="1110" width="200" height="60" fill="#FFE0B2" stroke="#E65100" stroke-width="2" rx="5"/>
    <text x="610" y="1135" text-anchor="middle" font-size="14" font-weight="bold">3. Generate</text>
    <text x="610" y="1155" text-anchor="middle" font-size="11">LLM + Examples</text>

    <rect x="740" y="1110" width="200" height="60" fill="#E8F5E9" stroke="#388E3C" stroke-width="2" rx="5"/>
    <text x="840" y="1135" text-anchor="middle" font-size="14" font-weight="bold">4. Validate</text>
    <text x="840" y="1155" text-anchor="middle" font-size="11">Check & Fix Code</text>

    <rect x="970" y="1110" width="200" height="60" fill="#E3F2FD" stroke="#1976D2" stroke-width="2" rx="5"/>
    <text x="1070" y="1135" text-anchor="middle" font-size="14" font-weight="bold">5. Execute</text>
    <text x="1070" y="1155" text-anchor="middle" font-size="11">Spawn Dragon!</text>

    <!-- Flow arrows -->
    <path d="M 250,1140 L 280,1140" stroke="#333" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
    <path d="M 480,1140 L 510,1140" stroke="#333" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
    <path d="M 710,1140 L 740,1140" stroke="#333" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
    <path d="M 940,1140 L 970,1140" stroke="#333" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  </g>

  <!-- Key Features -->
  <g id="features">
    <text x="50" y="1230" font-size="24" font-weight="bold" fill="#333">Key Features</text>

    <rect x="50" y="1250" width="280" height="100" fill="#F3E5F5" stroke="#7B1FA2" stroke-width="2" rx="5"/>
    <text x="190" y="1275" text-anchor="middle" font-size="16" font-weight="bold" fill="#4A148C">Example-Based Learning</text>
    <text x="190" y="1295" text-anchor="middle" font-size="12">• High-quality templates</text>
    <text x="190" y="1315" text-anchor="middle" font-size="12">• Keyword matching</text>
    <text x="190" y="1335" text-anchor="middle" font-size="12">• Context-aware selection</text>

    <rect x="360" y="1250" width="280" height="100" fill="#FFF9C4" stroke="#F57F17" stroke-width="2" rx="5"/>
    <text x="500" y="1275" text-anchor="middle" font-size="16" font-weight="bold" fill="#F57F17">Smart Validation</text>
    <text x="500" y="1295" text-anchor="middle" font-size="12">• Syntax checking</text>
    <text x="500" y="1315" text-anchor="middle" font-size="12">• Pattern validation</text>
    <text x="500" y="1335" text-anchor="middle" font-size="12">• Auto-repair attempts</text>

    <rect x="670" y="1250" width="280" height="100" fill="#E0F2F1" stroke="#00695C" stroke-width="2" rx="5"/>
    <text x="810" y="1275" text-anchor="middle" font-size="16" font-weight="bold" fill="#004D40">Fast & Cheap</text>
    <text x="810" y="1295" text-anchor="middle" font-size="12">• ~2 token cost per request</text>
    <text x="810" y="1315" text-anchor="middle" font-size="12">• Streaming responses</text>
    <text x="810" y="1335" text-anchor="middle" font-size="12">• Multiple models supported</text>

    <rect x="980" y="1250" width="190" height="100" fill="#FFEBEE" stroke="#C62828" stroke-width="2" rx="5"/>
    <text x="1075" y="1275" text-anchor="middle" font-size="16" font-weight="bold" fill="#B71C1C">Safe Execution</text>
    <text x="1075" y="1295" text-anchor="middle" font-size="12">• Sandboxed code</text>
    <text x="1075" y="1315" text-anchor="middle" font-size="12">• Error handling</text>
    <text x="1075" y="1335" text-anchor="middle" font-size="12">• Race protection</text>
  </g>

  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#333" />
    </marker>
  </defs>

  <!-- Footer -->
  <text x="600" y="1385" text-anchor="middle" font-size="12" fill="#666">
    Few-Shot AI System • VoxelWorld • v1.0 • 2026-02-09
  </text>
</svg>
